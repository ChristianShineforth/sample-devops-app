apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: myapp
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: REGISTRY/myapp-worker:TAG
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: myapp-secrets, key: databaseUrl }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: myapp-secrets, key: redisUrl }
